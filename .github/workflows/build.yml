name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Android repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Download complete web build assets
      run: |
        mkdir -p omnia-web
        wget --mirror --convert-links --adjust-extension --page-requisites --no-parent -P temp_web https://omnia-3l2.pages.dev || true
        cp -r temp_web/omnia-3l2.pages.dev/* omnia-web/ || true
        # Inyectar consola de depuración Eruda en index.html
        sed -i 's|</head>|<script src="https://cdn.jsdelivr.net/npm/eruda"></script><script>eruda.init();</script></head>|g' omnia-web/index.html || true
        mkdir -p android/app/src/main/assets

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK with Gradle
      run: gradle assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
