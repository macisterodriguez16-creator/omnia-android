name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Android repository
      uses: actions/checkout@v4

    - name: Checkout Web repository
      uses: actions/checkout@v4
      with:
        repository: macisterodriguez16-creator/omnia-web
        path: omnia-web-temp

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Web Application and prepare assets
      run: |
        cd omnia-web-temp
        npm ci || npm install
        npm run build
        mkdir -p ../../omnia-web
        # Copia los archivos generados por el build (dist/build/www) hacia ../omnia-web
        if [ -d "dist" ]; then cp -r dist/* ../../omnia-web/; fi
        if [ -d "build" ]; then cp -r build/* ../../omnia-web/; fi
        if [ -d "www" ]; then cp -r www/* ../../omnia-web/; fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Install Android wrapper dependencies
      run: npm ci || npm install

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK with Gradle
      run: gradle assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
