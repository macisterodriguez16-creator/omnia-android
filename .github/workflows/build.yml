name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Android repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Download web build assets
      run: |
        rm -rf omnia-web
        mkdir -p omnia-web
        # Descargar el sitio web preservando la estructura
        wget --recursive --page-requisites --html-extension --convert-links --restrict-file-names=windows -P temp_web https://omnia-3l2.pages.dev/ || true
        # Mover todo el contenido extraído a omnia-web
        find temp_web -name "index.html" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/. omnia-web/ || true
        # Si no se encontró index.html, crear una estructura base de rescate
        if [ ! -f "omnia-web/index.html" ]; then
          curl -sL https://omnia-3l2.pages.dev/ -o omnia-web/index.html
        fi
        # Inyectar consola Eruda para depurar la pantalla blanca
        sed -i 's|<head>|<head><script src="https://cdn.jsdelivr.net/npm/eruda"></script><script>eruda.init();</script>|g' omnia-web/index.html || true
        mkdir -p android/app/src/main/assets

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK with Gradle
      run: gradle assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
